openapi: 3.0.3
info:
  title: Catch Me Backend API
  description: "# Catch Me API Specification\nComprehensive OpenAPI 3.0 documentation\
    \ for the **Catch Me Backend** service. \nThis API powers the Catch Me sports\
    \ social and matchmaking ecosystem, handling user management, live match tracking,\
    \ feed scoring and recommendations, engagement signals, leaderboards, global search,\
    \ and AI-powered match summaries (via Google Gemini and xAI Grok).\n"
  version: 1.0.0
  contact:
    name: Catch Me Engineering Team
    url: https://catchme.live
    email: dev@catchme.live
  license:
    name: ISC
servers:
- url: http://localhost:5000
  description: Local Development Server
- url: https://api.catchme.live
  description: Production Primary Server
- url: https://api2.catchme.live
  description: Production Secondary Server
tags:
- name: System
  description: Health check and root operational endpoints
- name: Users
  description: User profile retrieval, fuzzy/prefix search, cascading deletion, and
    "You May Know" graph suggestions
- name: Feed
  description: Personalized algorithmic content feed and granular component fetching
- name: Games
  description: Match lifecycle, statistics standardization, dynamic PDF exports, and
    AI game commentaries
- name: Events
  description: Sports events management, type filtering, local fuzzy search, and cascading
    deletion
- name: Posts
  description: Content post queries, local caption/tag search, and cascading deletion
- name: Engagement
  description: Implicit user engagement tracking (dwell time, clicks, views)
- name: Leaderboard
  description: Real-time user rankings with daily Realtime Database caching
- name: Notifications
  description: FCM push notification dispatching, multicast, and broadcast engine
- name: Search
  description: Multi-entity search across users, teams, and hashtags
- name: Batch
  description: High-performance Redis-first batch entity lookups (users, posts, events,
    games) preventing client-side Firestore read spikes
- name: QR & Links
  description: High-performance PNG QR code generation, Base64 Data URLs, and LinkUtils
    parity parsing for mobile and web deep links.
- name: Scout & Organizer
  description: Tablet-friendly interactive web view, daily performance summaries,
    official match verification sheets, and athlete scouting dossiers in PDF/CSV formats.
paths:
  /:
    get:
      tags:
      - System
      summary: Root Service Verification
      description: Returns service identifier string to verify that the server is
        online.
      responses:
        '200':
          description: Service online
          content:
            text/plain:
              schema:
                type: string
                example: Catch Me Backend
  /ping:
    get:
      tags:
      - System
      summary: Ping Health Check
      description: Lightweight probe for load balancer health checking.
      responses:
        '200':
          description: Server healthy
          content:
            text/plain:
              schema:
                type: string
                example: Pong!
  /api/users:
    get:
      tags:
      - Users
      summary: Get All Users
      description: Retrieves all user profiles stored in Firestore.
      parameters:
      - $ref: '#/components/parameters/SessionIdHeader'
      responses:
        '200':
          description: List of user profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/users/local-search:
    get:
      tags:
      - Users
      summary: Local Fuzzy Search Users
      description: Fast in-memory fuzzy search across minified local user data (`users_min.json`)
        via Fuse.js matching against `name` and `username`.
      parameters:
      - $ref: '#/components/parameters/SessionIdHeader'
      - name: q
        in: query
        required: true
        description: Query string matching name or username
        schema:
          type: string
          example: jane
      responses:
        '200':
          description: Matched users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MinifiedUser'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/users/search:
    get:
      tags:
      - Users
      summary: Search Users (Firestore Prefix)
      description: Performs a prefix query directly against the `name` property in
        the Firestore `users` collection.
      parameters:
      - $ref: '#/components/parameters/SessionIdHeader'
      - name: q
        in: query
        required: true
        description: Name prefix query string
        schema:
          type: string
          example: Jan
      responses:
        '200':
          description: Array of matched user documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/users/{id}:
    get:
      tags:
      - Users
      summary: Get User by ID
      description: Retrieves complete user profile and preferences by Firestore document
        ID.
      parameters:
      - $ref: '#/components/parameters/SessionIdHeader'
      - $ref: '#/components/parameters/UserIdPathParam'
      responses:
        '200':
          description: User profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    delete:
      tags:
      - Users
      summary: Delete User (Cascading Cleanup)
      description: 'Deletes a user account and removes all associated traces across
        Firestore in an atomic batch:

        - Removes ID from other users'' `followers`, `following`, and `blockedUsers`.

        - Removes ID from all posts'' `likes`, `shares`, and `saves`.

        - Deletes all posts authored by the user.

        - Removes user from event player rosters (`data.players`) and polls (`data.votes.userVotes`).

        - Deletes all chat documents where the user is a member.

        - Deletes the primary user record.

        '
      parameters:
      - $ref: '#/components/parameters/UserIdPathParam'
      responses:
        '200':
          description: User and all references successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/users/{id}/suggestions:
    get:
      tags:
      - Users
      summary: Get User Suggestions ("You May Know")
      description: Traverses social graph (2nd-degree connections) to recommend users
        followed by the people the current user follows, ranked by mutual friend count.
      parameters:
      - $ref: '#/components/parameters/SessionIdHeader'
      - $ref: '#/components/parameters/UserIdPathParam'
      responses:
        '200':
          description: List of user suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSuggestion'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/feed/{id}:
    get:
      tags:
      - Feed
      summary: Get User Feed
      description: 'Generates a comprehensive personalized feed for a user based on
        engagement weights, role multipliers, content quality thresholds, diversity
        controls, and affinity bonuses.

        Feed results are automatically cached in the Firebase Realtime Database.

        '
      parameters:
      - $ref: '#/components/parameters/SessionIdHeader'
      - $ref: '#/components/parameters/UserIdPathParam'
      - $ref: '#/components/parameters/FeedFilterParam'
      responses:
        '200':
          description: Personalized feed response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/feed/{id}/{type}:
    get:
      tags:
      - Feed
      summary: Get Granular Feed Component
      description: Retrieves a specific component of the feed for modular UI rendering
        or infinite scrolling.
      parameters:
      - $ref: '#/components/parameters/SessionIdHeader'
      - $ref: '#/components/parameters/UserIdPathParam'
      - name: type
        in: path
        required: true
        description: Feed component category
        schema:
          type: string
          enum:
          - posts
          - highlights
          - images
          - thoughts
          - games
          - users
          - upcoming
          - popular
          example: highlights
      - $ref: '#/components/parameters/FeedFilterParam'
      responses:
        '200':
          description: Granular feed segment data
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/FeedPosts'
                - type: array
                  items:
                    $ref: '#/components/schemas/PostItem'
                - type: array
                  items:
                    type: string
                    description: Game or Event IDs
                - type: array
                  items:
                    $ref: '#/components/schemas/UserSuggestion'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/feed/{id}/{type}/{subtype}:
    get:
      tags:
      - Feed
      summary: Get Granular Feed Subtype Component
      description: Retrieves a filtered sub-component (e.g. `/api/feed/user123/posts/highlights`
        or `/api/feed/user123/popular/images`).
      parameters:
      - $ref: '#/components/parameters/SessionIdHeader'
      - $ref: '#/components/parameters/UserIdPathParam'
      - name: type
        in: path
        required: true
        description: Component parent type (`posts` or `popular`)
        schema:
          type: string
          enum:
          - posts
          - popular
          example: posts
      - name: subtype
        in: path
        required: true
        description: Specific content format subtype
        schema:
          type: string
          enum:
          - highlights
          - images
          - thoughts
          example: highlights
      - $ref: '#/components/parameters/FeedFilterParam'
      responses:
        '200':
          description: Subtype post array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostItem'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/games:
    get:
      tags:
      - Games
      summary: Get All Games
      description: Retrieves all match events (`type == "game"`) from Firestore.
      responses:
        '200':
          description: List of game objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameEvent'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/games/{id}:
    get:
      tags:
      - Games
      summary: Get Game by ID
      description: Retrieves a single match event by ID.
      parameters:
      - $ref: '#/components/parameters/GameIdPathParam'
      responses:
        '200':
          description: Game details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameEvent'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/games/{id}/standardize:
    post:
      tags:
      - Games
      summary: Standardize Game Data
      description: Re-computes and standardizes team stats and player stats according
        to the sport's scoring rules, updating Firestore.
      parameters:
      - $ref: '#/components/parameters/GameIdPathParam'
      responses:
        '200':
          description: Game standardized successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStandardizeResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/games/{id}/end:
    post:
      tags:
      - Games
      summary: End Game
      description: Concludes a match by marking its status as `ended`.
      parameters:
      - $ref: '#/components/parameters/GameIdPathParam'
      responses:
        '200':
          description: Updated ended game document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameEvent'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/games/{id}/export:
    post:
      tags:
      - Games
      summary: Export Game PDF Link
      description: Returns the URL used to stream/download the dynamic PDF game summary
        report.
      parameters:
      - $ref: '#/components/parameters/GameIdPathParam'
      responses:
        '200':
          description: Download link payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportPdfResponse'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/games/{id}/download:
    get:
      tags:
      - Games
      summary: Download Official Match Verification & Game Sheet PDF
      description: Generates a complete match sheet PDF featuring Catch Me branding,
        live game QR code, final scores, goals timeline, disciplinary cards (Yellow/Red),
        full team lineups & player box scores, and referee/scouter sign-off certification
        lines.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: PDF binary stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Game not found
  /api/games/{id}/summary:
    post:
      tags:
      - Games
      summary: Create AI Game Summary
      description: Generates an AI-written sports commentary summary using Google
        Gemini (with fallback to xAI Grok) and saves it in Firebase Realtime Database.
      parameters:
      - $ref: '#/components/parameters/GameIdPathParam'
      responses:
        '201':
          description: Summary successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSummaryResponse'
        '200':
          description: Existing summary retrieved from cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSummaryResponse'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    put:
      tags:
      - Games
      summary: Update AI Game Summary
      description: Regenerates AI game summary if the previous summary is older than
        10 minutes (rate limited).
      parameters:
      - $ref: '#/components/parameters/GameIdPathParam'
      responses:
        '200':
          description: Summary updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSummaryResponse'
        '400':
          description: Throttle limit reached (last updated < 10 minutes ago)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Summary was updated recently. Please wait before updating
                      again.
                  summary:
                    $ref: '#/components/schemas/GameSummaryResponse'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    delete:
      tags:
      - Games
      summary: Delete AI Game Summary
      description: Removes the game commentary summary from Firebase Realtime Database.
      parameters:
      - $ref: '#/components/parameters/GameIdPathParam'
      responses:
        '200':
          description: Summary deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/events:
    get:
      tags:
      - Events
      summary: Get All Events
      description: Retrieves all event records from Firestore.
      responses:
        '200':
          description: List of all events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventItem'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/events/local-search:
    get:
      tags:
      - Events
      summary: Local Fuzzy Search Events
      description: Fast in-memory fuzzy search across minified local game and event
        data (`games_min.json`) via Fuse.js.
      parameters:
      - name: q
        in: query
        required: true
        description: Search term matching event title, sport, or tag
        schema:
          type: string
          example: basketball
      responses:
        '200':
          description: Matched event results
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    sport:
                      type: string
                    tags:
                      type: array
                      items:
                        type: string
        '400':
          $ref: '#/components/responses/400BadRequest'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/events/{id}:
    get:
      tags:
      - Events
      summary: Get Event by ID
      description: Retrieves details of a specific event by Firestore Document ID.
      parameters:
      - $ref: '#/components/parameters/EventIdPathParam'
      responses:
        '200':
          description: Event found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventItem'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    delete:
      tags:
      - Events
      summary: Delete Event (Cascading Cleanup)
      description: 'Deletes the event document and atomically removes its ID from
        users'' `events`, `games`, `myCustomEvents`, `myGames`, `feed.events`, and
        `feed.games` arrays.

        '
      parameters:
      - $ref: '#/components/parameters/EventIdPathParam'
      responses:
        '200':
          description: Event and its references deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/events/{type}:
    get:
      tags:
      - Events
      summary: Get Events by Type
      description: Retrieves events filtered by their `type` attribute (e.g. `game`,
        `practice`, `tournament`, `tryout`).
      parameters:
      - name: type
        in: path
        required: true
        description: Event category type
        schema:
          type: string
          example: practice
      responses:
        '200':
          description: Array of events matching the type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventItem'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/posts/local-search:
    get:
      tags:
      - Posts
      summary: Local Fuzzy Search Posts
      description: Fast in-memory search across minified local post data (`posts_min.json`)
        via Fuse.js matching against `caption` and `tags`.
      parameters:
      - name: q
        in: query
        required: true
        description: Search term matching post caption or hashtags
        schema:
          type: string
          example: dunk
      responses:
        '200':
          description: Matched posts list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    caption:
                      type: string
                    tags:
                      type: array
                      items:
                        type: string
                    userId:
                      type: string
                    type:
                      type: string
        '400':
          $ref: '#/components/responses/400BadRequest'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/posts/{id}:
    get:
      tags:
      - Posts
      summary: Get User Post Feed
      description: Generates user feed for the specified user ID.
      parameters:
      - $ref: '#/components/parameters/PostIdPathParam'
      - $ref: '#/components/parameters/FeedFilterParam'
      responses:
        '200':
          description: Feed response object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    delete:
      tags:
      - Posts
      summary: Delete Post (Cascading Cleanup)
      description: 'Deletes a post and cleans up references across other collections:

        - Removes post ID from `likedPosts` of all users who liked it.

        - Removes post ID from `savedPosts` of all users who saved it.

        - Removes post ID from creator''s `posts` array.

        - Deletes the primary post document.

        '
      parameters:
      - $ref: '#/components/parameters/PostIdPathParam'
      responses:
        '200':
          description: Post deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/engage/signal:
    post:
      tags:
      - Engagement
      summary: Record Engagement Signal
      description: Records user engagement signals such as viewing dwell time (in
        milliseconds) or user click interactions on posts or games.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngagementSignalRequest'
      responses:
        '200':
          description: Engagement signal recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementSuccessResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/leaderboard:
    get:
      tags:
      - Leaderboard
      summary: Get Rankings Leaderboard
      description: 'Returns paginated and ranked user leaderboards based on score
        calculation: `(level * 100) + xp + (followers * 5) + (posts * 2)`.

        Results are cached daily per filter combination in Firebase Realtime Database.

        '
      parameters:
      - $ref: '#/components/parameters/LeaderboardRoleParam'
      - $ref: '#/components/parameters/LeaderboardCountryParam'
      - $ref: '#/components/parameters/LeaderboardLocationParam'
      - $ref: '#/components/parameters/LeaderboardRegionParam'
      - $ref: '#/components/parameters/LeaderboardSportParam'
      - $ref: '#/components/parameters/LimitQueryParam'
      - $ref: '#/components/parameters/PageQueryParam'
      responses:
        '200':
          description: Paginated leaderboard rankings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/notifications/send:
    post:
      tags:
      - Notifications
      summary: Send Notification / Event
      description: Dispatches push notifications (or silent in-app events) via FCM
        and logs the dispatch in Firebase Realtime Database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSendRequest'
      responses:
        '200':
          description: Notification successfully sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSendResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/notifications/send-all:
    post:
      tags:
      - Notifications
      summary: Broadcast Notification to All Users
      description: Resolves all active FCM device tokens for all registered users
        and executes a multicast push dispatch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSendAllRequest'
      responses:
        '200':
          description: Broadcast successfully dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSendResponse'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/search:
    get:
      tags:
      - Search
      summary: Global Search
      description: Executes unified search across individual user accounts, team accounts,
        and trending hashtags.
      parameters:
      - name: q
        in: query
        required: true
        description: Search term query
        schema:
          type: string
          example: warriors
      responses:
        '200':
          description: Multi-entity search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSearchResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/batch:
    post:
      tags:
      - Batch
      summary: Universal Multi-Entity Batch Fetch
      description: Fetches multiple entities (users, posts, events, games) in a single
        request. Utilizes Redis-first caching (1-hour TTL). Only IDs that are cache
        misses are fetched from Firestore and cached automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiBatchRequest'
      responses:
        '200':
          description: Batch fetch results with cache performance metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiBatchResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/batch/{type}:
    post:
      tags:
      - Batch
      summary: Type-Specific Batch Fetch
      description: Batch fetches items for a given entity type (`users`, `posts`,
        `events`, `games`) by ID. Checks Upstash Redis cache first (1-hour TTL); fetches
        missing items from Firestore and populates Redis.
      parameters:
      - name: type
        in: path
        required: true
        description: Entity type to fetch
        schema:
          type: string
          enum:
          - users
          - posts
          - events
          - games
          example: users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchIdsRequest'
      responses:
        '200':
          description: List of resolved entities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /api/users/batch:
    post:
      tags:
      - Users
      - Batch
      summary: Batch Get Users (Redis-first)
      description: Retrieves multiple user profiles by array of IDs. Checks Redis
        `user:profile:{id}` (1-hour TTL) before querying Firestore.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchIdsRequest'
      responses:
        '200':
          description: Array of user profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
