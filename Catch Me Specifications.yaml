          type: string
        description: Catch Me link to parse
      responses:
        '200':
          description: Resolved entity details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrParseResponse'
    post:
      tags:
      - QR & Links
      summary: Parse and Resolve Catch Me Deep Link (POST)
      description: Parses link from request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - link
              properties:
                link:
                  type: string
      responses:
        '200':
          description: Resolved entity details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrParseResponse'
