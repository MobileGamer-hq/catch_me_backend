  /api/qr:
    get:
      tags:
      - QR & Links
      summary: Generate QR Code (PNG Buffer or JSON)
      description: Generates a PNG QR code buffer or JSON Data URL for any arbitrary
        URL, link, or Catch Me entity (type + id).
      parameters:
      - name: url
        in: query
        schema:
          type: string
        description: Direct URL to encode into QR
      - name: type
        in: query
        schema:
          type: string
          enum:
          - profile
          - game
          - lineup
          - stats
          - post
          - challenge
        description: Entity type
      - name: id
        in: query
        schema:
          type: string
        description: Entity ID
      - name: format
        in: query
        schema:
          type: string
          enum:
          - png
          - json
          default: png
        description: Output format
      - name: size
        in: query
        schema:
          type: integer
          default: 300
        description: QR code width/height in px
      - name: dark
        in: query
        schema:
          type: string
          default: '#1E1B4B'
        description: Dark module hex color
      - name: light
        in: query
        schema:
          type: string
          default: '#FFFFFF'
        description: Light module hex color
      responses:
        '200':
          description: PNG image stream or JSON with Base64 Data URL
          content:
            image/png:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/QrGenerateResponse'
        '400':
          description: Missing parameters
