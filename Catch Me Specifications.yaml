components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Optional bearer token for authenticated user actions.
  parameters:
    SessionIdHeader:
      name: x-session-id
      in: header
      required: false
      description: Client session identifier for A/B testing and algorithmic bucket
        routing (`A` or `B`).
      schema:
        type: string
        default: default
        example: session_user_991823
    UserIdPathParam:
      name: id
      in: path
      required: true
      description: Target user's Firestore document ID
      schema:
        type: string
        example: user_abc123
    GameIdPathParam:
      name: id
      in: path
      required: true
      description: Target game's Firestore event ID
      schema:
        type: string
        example: game_101
    EventIdPathParam:
      name: id
      in: path
      required: true
      description: Target event's Firestore document ID
      schema:
        type: string
        example: event_001
    PostIdPathParam:
      name: id
      in: path
      required: true
      description: Target post's Firestore document ID (or User ID for post feed)
      schema:
        type: string
        example: post_789
    FeedFilterParam:
      name: filter
      in: query
      required: false
      description: Filter strategy for feed recommendations
      schema:
        type: string
        enum:
        - all
        - followers
        - trending
        - suggested
        default: all
        example: all
    LeaderboardRoleParam:
      name: role
      in: query
      required: false
      description: User role filter
      schema:
        type: string
        enum:
        - athlete
        - coach
        - scout
        - team
        - fan
        example: athlete
    LeaderboardCountryParam:
      name: country
      in: query
      required: false
      description: Country filter
      schema:
        type: string
        example: USA
    LeaderboardLocationParam:
      name: location
      in: query
      required: false
      description: City or location filter
      schema:
        type: string
        example: Chicago
    LeaderboardRegionParam:
      name: region
      in: query
      required: false
      description: Geographical region or state filter
      schema:
        type: string
        example: Midwest
    LeaderboardSportParam:
      name: sport
      in: query
      required: false
      description: Sport filter (matched against user's `favoriteSports`)
      schema:
        type: string
        example: Basketball
    LimitQueryParam:
      name: limit
      in: query
      required: false
      description: Maximum number of items per page
      schema:
        type: integer
        default: 50
        example: 25
    PageQueryParam:
      name: page
      in: query
      required: false
      description: Pagination page number
      schema:
        type: integer
        default: 1
        example: 1
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: user_abc123
        name:
          type: string
          example: Jane Doe
        username:
          type: string
          example: janedoe
        email:
          type: string
          format: email
          example: jane@example.com
        role:
          type: string
          enum:
          - athlete
          - coach
          - scout
          - team
          - fan
          example: athlete
        level:
          type: integer
          example: 4
        xp:
          type: integer
          example: 1250
        country:
          type: string
          example: USA
        location:
          type: string
          example: New York
        region:
          type: string
          example: East Coast
        sport:
          type: string
          example: Basketball
        favoriteSports:
          type: array
          items:
            type: string
          example:
          - Basketball
          - Tennis
        followers:
          type: array
          items:
            type: string
          example:
          - user_xyz789
        following:
          type: array
          items:
            type: string
          example:
          - user_456def
        likedPosts:
          type: array
          items:
            type: string
          example:
          - post_1
          - post_2
        savedPosts:
          type: array
          items:
            type: string
          example:
          - post_5
        profilePic:
          type: string
          format: uri
          example: https://storage.catchme.live/profiles/user_abc123.jpg
        fcmToken:
          type: string
          example: eX_fcm_token_example
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T08:30:00.000Z'
    MinifiedUser:
      type: object
      properties:
        id:
          type: string
          example: user_abc123
        name:
          type: string
          example: Jane Doe
        username:
          type: string
          example: janedoe
        role:
          type: string
          example: athlete
        avatar:
          type: string
          format: uri
          example: https://storage.catchme.live/profiles/user_abc123.jpg
    UserSuggestion:
      type: object
      properties:
        id:
          type: string
          example: user_rec999
        name:
          type: string
          example: Alex Johnson
        username:
          type: string
          example: alexj
        avatar:
          type: string
          format: uri
          example: https://storage.catchme.live/profiles/alexj.jpg
        role:
          type: string
          example: athlete
        mutualCount:
          type: integer
          example: 5
    PostItem:
      type: object
      properties:
        id:
          type: string
          example: post_hl_01
        userId:
          type: string
          example: user_scout1
        type:
          type: string
          enum:
          - highlight
          - image
          - thought
          example: highlight
        mediaUrl:
          type: string
          format: uri
          example: https://storage.catchme.live/videos/hl01.mp4
        caption:
          type: string
          example: Incredible step-back three!
        tags:
          type: array
          items:
            type: string
          example:
          - basketball
          - clutch
        likes:
          type: array
          items:
            type: string
          example:
          - user_a
          - user_b
        views:
          type: integer
          example: 350
        finalScore:
          type: number
          example: 142.5
        createdAt:
          type: string
          format: date-time
          example: '2026-05-10T12:00:00.000Z'
    FeedPosts:
      type: object
      properties:
        highlights:
          type: array
          items:
            $ref: '#/components/schemas/PostItem'
        images:
          type: array
          items:
            $ref: '#/components/schemas/PostItem'
        thoughts:
          type: array
          items:
            $ref: '#/components/schemas/PostItem'
    FeedResponse:
      type: object
      properties:
        posts:
          $ref: '#/components/schemas/FeedPosts'
        games:
          type: array
          items:
            type: string
          example:
          - game_event_101
          - game_event_102
        suggestedUsers:
          type: array
          items:
            $ref: '#/components/schemas/UserSuggestion'
        upcomingGames:
          type: array
          items:
            type: string
          example:
          - game_event_201
          - game_event_202
        popular:
          $ref: '#/components/schemas/FeedPosts'
    GameEvent:
      type: object
      properties:
        id:
          type: string
          example: game_101
        type:
          type: string
          example: game
        sport:
          type: string
          example: football
        title:
          type: string
          example: Arsenal vs Chelsea
        date:
          type: string
          format: date-time
          example: '2026-05-10T15:00:00.000Z'
        location:
          type: string
          example: Emirates Stadium
        currentState:
          type: object
          properties:
            status:
              type: string
              enum:
              - upcoming
              - ongoing
              - ended
              - completed
              - finished
              example: ongoing
            homeScore:
              type: integer
              example: 2
            awayScore:
              type: integer
              example: 1
            currentPeriod:
              type: integer
              example: 2
        data:
          type: object
          properties:
            homeTeam:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                  example: Arsenal
                players:
                  type: array
                  items:
                    type: object
            awayTeam:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                  example: Chelsea
                players:
                  type: array
                  items:
                    type: object
    GameStandardizeResponse:
      type: object
      properties:
        message:
          type: string
          example: Game standardized successfully
        game:
          $ref: '#/components/schemas/GameEvent'
    GameSummaryResponse:
      type: object
      properties:
        summary:
          type: string
          example: In an exhilarating match at Emirates Stadium, Arsenal secured a
            2-1 victory over Chelsea...
        updatedAt:
          type: integer
          example: 1756401000000
    ExportPdfResponse:
      type: object
      properties:
        downloadUrl:
          type: string
          format: uri
          example: http://localhost:5000/api/games/game_101/download
    EventItem:
      type: object
      properties:
        id:
          type: string
          example: event_001
        type:
          type: string
          example: practice
        sport:
          type: string
          example: football
        title:
          type: string
          example: Varsity Open Practice
        date:
          type: string
          format: date-time
          example: '2026-07-01T10:00:00.000Z'
        location:
          type: string
          example: North Field
        userId:
          type: string
          example: coach_mike
    EngagementSignalRequest:
      type: object
      required:
      - type
      - targetId
      properties:
        type:
          type: string
          enum:
          - dwell
          - click
          description: Signal interaction type
